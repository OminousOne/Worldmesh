# Builds the documentation site (docs/) and publishes it to GitHub Pages at
# https://ominousone.github.io/Worldmesh/ whenever the docs change on main. The landing page
# shows code from examples/hello, so changes there rebuild it too.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - examples/hello/src/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
