<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Figtree, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <!-- Colors from the logo: the bus is the cyan seam that joins everything; cells own areas, so they wear area colors. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#85a3af"/>
    </marker>
  </defs>
  <rect width="760" height="400" rx="16" fill="#0b2a36"/>
  <!-- players -->
  <rect x="300" y="18" width="160" height="40" rx="10" fill="#0f3644" stroke="#2a5464"/>
  <text x="380" y="43" text-anchor="middle" fill="#e6f0f3">Players (browsers)</text>
  <line x1="380" y1="58" x2="380" y2="88" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="390" y="78" fill="#85a3af" font-size="11">WebSocket</text>
  <!-- gateway -->
  <rect x="290" y="90" width="180" height="46" rx="10" fill="#0f3644" stroke="#0bf4fd" stroke-width="1.5"/>
  <text x="380" y="111" text-anchor="middle" fill="#ffffff" font-weight="700">Gateway</text>
  <text x="380" y="127" text-anchor="middle" fill="#9fb9c3" font-size="11">merges views, checks inputs</text>
  <!-- bus -->
  <rect x="36" y="172" width="688" height="42" rx="21" fill="#00435a"/>
  <rect x="40" y="176" width="680" height="34" rx="17" fill="#0bf4fd"/>
  <text x="380" y="198" text-anchor="middle" fill="#00435a" font-weight="700">NATS bus</text>
  <line x1="380" y1="136" x2="380" y2="170" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- groups -->
  <rect x="40" y="252" width="200" height="120" rx="12" fill="#0f3644" stroke="#2a5464"/>
  <text x="140" y="276" text-anchor="middle" fill="#ffffff" font-weight="700">Server Entity Groups</text>
  <text x="140" y="294" text-anchor="middle" fill="#9fb9c3" font-size="11">simulate entities,</text>
  <text x="140" y="309" text-anchor="middle" fill="#9fb9c3" font-size="11">wherever they are</text>
  <text x="140" y="324" text-anchor="middle" fill="#9fb9c3" font-size="11">run your game code</text>
  <circle cx="100" cy="349" r="11" fill="none" stroke="#e6f0f3" stroke-width="3"/>
  <circle cx="140" cy="349" r="11" fill="none" stroke="#e6f0f3" stroke-width="3"/>
  <circle cx="180" cy="349" r="11" fill="none" stroke="#e6f0f3" stroke-width="3"/>
  <line x1="140" y1="216" x2="140" y2="250" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- cells -->
  <rect x="280" y="252" width="200" height="120" rx="12" fill="#0f3644" stroke="#2a5464"/>
  <text x="380" y="276" text-anchor="middle" fill="#ffffff" font-weight="700">Spatial Layer Cells</text>
  <text x="380" y="294" text-anchor="middle" fill="#9fb9c3" font-size="11">own areas, answer</text>
  <text x="380" y="309" text-anchor="middle" fill="#9fb9c3" font-size="11">"what's near me?"</text>
  <text x="380" y="324" text-anchor="middle" fill="#9fb9c3" font-size="11">build players' views</text>
  <rect x="329" y="338" width="22" height="22" rx="5" fill="#a4e000" stroke="#00435a" stroke-width="2"/>
  <rect x="369" y="338" width="22" height="22" rx="5" fill="#f55262" stroke="#00435a" stroke-width="2"/>
  <rect x="409" y="338" width="22" height="22" rx="5" fill="#05a3d1" stroke="#00435a" stroke-width="2"/>
  <line x1="380" y1="216" x2="380" y2="250" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- orchestrator -->
  <rect x="520" y="252" width="200" height="120" rx="12" fill="#0f3644" stroke="#2a5464"/>
  <text x="620" y="276" text-anchor="middle" fill="#ffffff" font-weight="700">Orchestrator</text>
  <text x="620" y="294" text-anchor="middle" fill="#9fb9c3" font-size="11">which groups and cells are in use</text>
  <text x="620" y="309" text-anchor="middle" fill="#9fb9c3" font-size="11">who owns which area</text>
  <text x="620" y="324" text-anchor="middle" fill="#9fb9c3" font-size="11">where new entities go</text>
  <line x1="620" y1="216" x2="620" y2="250" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
