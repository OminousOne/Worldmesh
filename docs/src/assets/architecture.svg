<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Figtree, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <!-- Each piece has its color in every diagram: players yellow, gateway blue, bus cyan, groups orange, cells green, orchestrator violet. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#85a3af"/>
    </marker>
  </defs>
  <rect width="760" height="400" rx="16" fill="#0b2a36"/>
  <!-- players -->
  <rect x="200" y="14" width="360" height="40" rx="10" fill="#0f3644" stroke="#ffc61a" stroke-width="2"/>
  <text x="380" y="39" text-anchor="middle" fill="#ffffff" font-weight="700">Players (browsers)</text>
  <line x1="210" y1="54" x2="210" y2="94" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="380" y1="54" x2="380" y2="94" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="550" y1="54" x2="550" y2="94" stroke="#85a3af" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="220" y="78" fill="#85a3af" font-size="11">WebSocket</text>
  <!-- gateways: any number -->
  <rect x="135" y="96" width="150" height="48" rx="10" fill="#0f3644" stroke="#38b6ff" stroke-width="2"/>
  <text x="210" y="117" text-anchor="middle" fill="#ffffff" font-weight="700">Gateway</text>
  <text x="210" y="134" text-anchor="middle" fill="#9fb9c3" font-size="11">merges its players' views</text>
  <rect x="305" y="96" width="150" height="48" rx="10" fill="#0f3644" stroke="#38b6ff" stroke-width="2"/>
  <text x="380" y="117" text-anchor="middle" fill="#ffffff" font-weight="700">Gateway</text>
  <text x="380" y="134" text-anchor="middle" fill="#9fb9c3" font-size="11">merges its players' views</text>
  <rect x="475" y="96" width="150" height="48" rx="10" fill="none" stroke="#38b6ff" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="550" y="117" text-anchor="middle" fill="#38b6ff" font-weight="700">+ more gateways</text>
  <text x="550" y="134" text-anchor="middle" fill="#9fb9c3" font-size="11">down to one per player</text>
  <!-- bus -->
  <rect x="36" y="172" width="688" height="42" rx="21" fill="#00435a"/>
  <rect x="40" y="176" width="680" height="34" rx="17" fill="#0bf4fd"/>
  <text x="380" y="198" text-anchor="middle" fill="#00435a"><tspan font-weight="700">NATS bus</tspan>: one server, or a cluster of as many as you need</text>
  <line x1="210" y1="144" x2="210" y2="170" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="380" y1="144" x2="380" y2="170" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="550" y1="144" x2="550" y2="170" stroke="#85a3af" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- groups -->
  <rect x="40" y="252" width="200" height="120" rx="12" fill="#0f3644" stroke="#ff8a2a" stroke-width="2"/>
  <rect x="56" y="252" width="168" height="6" rx="3" fill="#ff8a2a"/>
  <text x="140" y="282" text-anchor="middle" fill="#ffffff" font-weight="700">Server Entity Groups</text>
  <text x="140" y="300" text-anchor="middle" fill="#9fb9c3" font-size="11">simulate entities,</text>
  <text x="140" y="315" text-anchor="middle" fill="#9fb9c3" font-size="11">wherever they are</text>
  <text x="140" y="330" text-anchor="middle" fill="#9fb9c3" font-size="11">run your game code</text>
  <circle cx="105" cy="352" r="9" fill="#ff8a2a" stroke="#0f3644" stroke-width="2"/>
  <circle cx="140" cy="352" r="9" fill="#ff8a2a" stroke="#0f3644" stroke-width="2"/>
  <circle cx="175" cy="352" r="9" fill="#ff8a2a" stroke="#0f3644" stroke-width="2"/>
  <line x1="140" y1="216" x2="140" y2="250" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- cells -->
  <rect x="280" y="252" width="200" height="120" rx="12" fill="#0f3644" stroke="#9be000" stroke-width="2"/>
  <rect x="296" y="252" width="168" height="6" rx="3" fill="#9be000"/>
  <text x="380" y="282" text-anchor="middle" fill="#ffffff" font-weight="700">Spatial Layer Cells</text>
  <text x="380" y="300" text-anchor="middle" fill="#9fb9c3" font-size="11">track who is where</text>
  <text x="380" y="315" text-anchor="middle" fill="#9fb9c3" font-size="11">build players' views</text>
  <text x="380" y="330" text-anchor="middle" fill="#9fb9c3" font-size="11">area actions, spatial queries</text>
  <rect x="331" y="342" width="20" height="20" rx="5" fill="#9be000" stroke="#0f3644" stroke-width="2"/>
  <rect x="370" y="342" width="20" height="20" rx="5" fill="#9be000" stroke="#0f3644" stroke-width="2"/>
  <rect x="409" y="342" width="20" height="20" rx="5" fill="#9be000" stroke="#0f3644" stroke-width="2"/>
  <line x1="380" y1="216" x2="380" y2="250" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- orchestrator -->
  <rect x="520" y="252" width="200" height="120" rx="12" fill="#0f3644" stroke="#b18cff" stroke-width="2"/>
  <rect x="536" y="252" width="168" height="6" rx="3" fill="#b18cff"/>
  <text x="620" y="282" text-anchor="middle" fill="#ffffff" font-weight="700">Orchestrator</text>
  <text x="620" y="300" text-anchor="middle" fill="#9fb9c3" font-size="11">which groups and cells are in use</text>
  <text x="620" y="315" text-anchor="middle" fill="#9fb9c3" font-size="11">who owns which area</text>
  <text x="620" y="330" text-anchor="middle" fill="#9fb9c3" font-size="11">where new entities go</text>
  <line x1="620" y1="216" x2="620" y2="250" stroke="#85a3af" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
