<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8798ad"/>
    </marker>
  </defs>
  <rect width="760" height="400" rx="12" fill="#f6f9fc"/>
  <!-- players -->
  <g fill="#0a2540">
    <rect x="300" y="18" width="160" height="40" rx="8" fill="#fff" stroke="#c1ccd8"/>
    <text x="380" y="43" text-anchor="middle">Players (browsers)</text>
  </g>
  <line x1="380" y1="58" x2="380" y2="88" stroke="#8798ad" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="390" y="78" fill="#556677" font-size="11">WebSocket</text>
  <!-- gateway -->
  <rect x="290" y="90" width="180" height="46" rx="8" fill="#fff" stroke="#635bff" stroke-width="1.5"/>
  <text x="380" y="111" text-anchor="middle" fill="#0a2540" font-weight="600">Gateway</text>
  <text x="380" y="127" text-anchor="middle" fill="#556677" font-size="11">merges views, checks inputs</text>
  <!-- bus -->
  <rect x="40" y="176" width="680" height="34" rx="17" fill="#635bff"/>
  <text x="380" y="198" text-anchor="middle" fill="#fff" font-weight="600">NATS bus</text>
  <line x1="380" y1="136" x2="380" y2="174" stroke="#8798ad" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- groups -->
  <g>
    <rect x="40" y="252" width="200" height="120" rx="10" fill="#fff" stroke="#c1ccd8"/>
    <text x="140" y="276" text-anchor="middle" fill="#0a2540" font-weight="600">Server Entity Groups</text>
    <text x="140" y="296" text-anchor="middle" fill="#556677" font-size="11">simulate entities, wherever they are</text>
    <text x="140" y="312" text-anchor="middle" fill="#556677" font-size="11">run your Game code</text>
    <circle cx="90" cy="345" r="13" fill="none" stroke="#3987e5" stroke-width="3"/>
    <circle cx="140" cy="345" r="13" fill="none" stroke="#d95926" stroke-width="3"/>
    <circle cx="190" cy="345" r="13" fill="none" stroke="#199e70" stroke-width="3"/>
  </g>
  <line x1="140" y1="212" x2="140" y2="250" stroke="#8798ad" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- cells -->
  <g>
    <rect x="280" y="252" width="200" height="120" rx="10" fill="#fff" stroke="#c1ccd8"/>
    <text x="380" y="276" text-anchor="middle" fill="#0a2540" font-weight="600">Spatial Layer Cells</text>
    <text x="380" y="296" text-anchor="middle" fill="#556677" font-size="11">own areas, answer "what's near me?"</text>
    <text x="380" y="312" text-anchor="middle" fill="#556677" font-size="11">build players' views</text>
    <rect x="320" y="333" width="24" height="24" fill="none" stroke="#556677" stroke-width="2.5"/>
    <rect x="368" y="333" width="24" height="24" fill="none" stroke="#556677" stroke-width="2.5"/>
    <rect x="416" y="333" width="24" height="24" fill="none" stroke="#556677" stroke-width="2.5"/>
  </g>
  <line x1="380" y1="212" x2="380" y2="250" stroke="#8798ad" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- orchestrator -->
  <g>
    <rect x="520" y="252" width="200" height="120" rx="10" fill="#fff" stroke="#c1ccd8"/>
    <text x="620" y="276" text-anchor="middle" fill="#0a2540" font-weight="600">Orchestrator</text>
    <text x="620" y="296" text-anchor="middle" fill="#556677" font-size="11">which groups and cells are in use</text>
    <text x="620" y="312" text-anchor="middle" fill="#556677" font-size="11">who owns which area</text>
    <text x="620" y="328" text-anchor="middle" fill="#556677" font-size="11">where new entities go</text>
  </g>
  <line x1="620" y1="212" x2="620" y2="250" stroke="#8798ad" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
